# ========================================
# Security Analyzer Tool - Configuração Central
# ========================================

# Configurações Gerais
APP_NAME="Security Analyzer Tool"
APP_VERSION="3.0.0"
APP_AUTHOR="@cybersecwonderwoman"

# Timeouts e Limites
DEFAULT_TIMEOUT=30
MAX_FILE_SIZE=104857600  # 100MB
API_RATE_LIMIT=4        # Requests per minute
CONNECTION_TIMEOUT=10

# Diretórios
CONFIG_DIR="$HOME/.security_analyzer"
LOG_FILE="$CONFIG_DIR/analysis.log"
CACHE_DIR="$CONFIG_DIR/cache"
REPORTS_DIR="$CONFIG_DIR/reports"
API_KEYS_FILE="$CONFIG_DIR/api_keys.enc"
TEMP_DIR="$CONFIG_DIR/temp"

# Retenção de Dados
REPORTS_RETENTION_DAYS=30
LOG_RETENTION_DAYS=90
CACHE_RETENTION_HOURS=24

# Logging
LOG_LEVEL="INFO"  # DEBUG, INFO, WARN, ERROR
MAX_LOG_SIZE=10485760  # 10MB

# Servidor Web para Relatórios
WEB_SERVER_PORT=8080
WEB_SERVER_HOST="127.0.0.1"

# URLs de APIs
VIRUSTOTAL_API_URL="https://www.virustotal.com/api/v3"
URLSCAN_API_URL="https://urlscan.io/api/v1"
SHODAN_API_URL="https://api.shodan.io"
THREATFOX_API_URL="https://threatfox-api.abuse.ch/api/v1"

# Configurações de Segurança
ENCRYPTION_ALGORITHM="aes-256-cbc"
HASH_ALGORITHM="sha256"
SECURE_DELETE=true

# Interface
ENABLE_COLORS=true
ENABLE_ANIMATIONS=true
MENU_TIMEOUT=300  # 5 minutos

# Análises
ENABLE_DEEP_SCAN=true
ENABLE_BEHAVIORAL_ANALYSIS=false
ENABLE_NETWORK_ANALYSIS=true
PARALLEL_ANALYSIS=true
MAX_CONCURRENT_JOBS=3

# Relatórios
DEFAULT_REPORT_FORMAT="html"
ENABLE_PDF_EXPORT=false
INCLUDE_SCREENSHOTS=false
REPORT_COMPRESSION=true
